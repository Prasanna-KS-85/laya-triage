name: Laya Triage
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (reads the config file)
        with:
          persist-credentials: false
      - uses: Prasanna-KS-85/laya-triage@v1.0.0
