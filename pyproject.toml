[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya_triage"
version = "0.0.0"
description = "GitHub Action that labels new issues as bug, feature, or question with a fine-tuned Laya decision model, gated on calibrated confidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "laya==0.3.23",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]
eval = [
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
