name: Laya Triage (sandbox)

# Sandbox workflow for PROJECT_SPEC.md §13 Phase 4 task 4 (runbook: sandbox/README.md in Prasanna-KS-85/laya-triage).
# Copy to .github/workflows/triage.yml in the sandbox repo and replace the placeholder SHA below with the commit
# of laya-triage under test. Issue text is never put into a shell line (§7.6): the Action reads $GITHUB_EVENT_PATH.
# Issues-triggered runs restore the caches but cannot save them (§7.7, R14); the twice-weekly schedule and the warm-cache
# dispatch input load the model so the caches are saved and stay in use.

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 3 * * 1,4"  # cache warm-up twice a week (Mon, Thu 03:17 UTC): margin against 7-day eviction
  workflow_dispatch:
    inputs:
      backfill-count:
        description: Open issues to classify (0 = none)
        default: "0"
      mode:
        description: dry-run or apply (empty = dry-run for backfill)
        default: ""
      warm-cache:
        description: Only load the model and save the caches (no issues read)
        type: boolean
        default: false
      latency-probe:
        description: Also run the NFR-1 latency probe
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner diagnostics (Q4)
        shell: bash
        run: |
          {
            echo "## Runner"
            echo "- logical CPUs: $(nproc)"
            echo "- CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
            echo "- RAM: $(free -m | awk '/^Mem:/{print $2}') MiB"
            echo "- image: ${ImageOS:-unknown} ${ImageVersion:-}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Prasanna-KS-85/laya-triage@0000000000000000000000000000000000000000 # placeholder: replace with the laya-triage commit SHA under test
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backfill-count: ${{ github.event.inputs.backfill-count || '0' }}
          mode: ${{ github.event.inputs.mode }}
          warm-cache: ${{ github.event_name == 'schedule' || github.event.inputs.warm-cache == 'true' }}

      - name: Latency probe (NFR-1)
        if: github.event.inputs.latency-probe == 'true'
        continue-on-error: true
        shell: bash
        run: |
          export HF_HOME="$HOME/.cache/huggingface" HF_HUB_OFFLINE=1
          "$HOME/.cache/laya-triage/venv/bin/python" .github/laya-probe/latency_probe.py \
            .github/laya-probe/issues.json --default-config .github/laya-probe/triage.default.yml
